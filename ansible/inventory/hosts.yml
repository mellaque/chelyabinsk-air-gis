---
# Инвентарь: только SSH-алиас сервера. Адрес, логин и ключ — в ~/.ssh/config управляющей машины,
# поэтому в публичном репозитории нет ни IP, ни имени пользователя.
all:
  hosts:
    homelab:
      # Явный путь вместо автоопределения: поведение не изменится, если на сервере появится второй Python
      ansible_python_interpreter: /usr/bin/python3
