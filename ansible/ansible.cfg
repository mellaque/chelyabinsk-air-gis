# Настройки Ansible. Файл читается, только если команды запускаются из каталога ansible/:
#   cd ansible && ansible-playbook playbook.yml
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Результаты задач — в YAML, а не в однострочном JSON: читать вывод и diff проще
callback_result_format = yaml

[ssh_connection]
# Модули передаются через уже открытое SSH-соединение, без копирования временных файлов — быстрее
pipelining = True
