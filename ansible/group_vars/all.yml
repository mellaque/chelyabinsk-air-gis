---
# Какая версия сайта работает на сервере. Образ задаётся по digest, а не по тегу: тег можно
# перевесить на другой образ, digest однозначно определяет содержимое.
#
# Выкатить новую версию — заменить значение (pull request) и запустить плейбук:
#   crane digest ghcr.io/mellaque/chelyabinsk-air-gis:latest
# Подпись образа плейбук проверяет сам и без неё ничего не запустит.
app_image_digest: sha256:012d2532e822079e6124355ad1cc8312bafb614fed08cf447b63cdc2ba2d2f11

# Сеть Docker «monitoring»: в ней Prometheus, экспортёры и обратный прокси. Подсеть задана явно
# (Docker иначе выбрал бы её сам), потому что от неё зависят сразу три роли:
#   docker     — создаёт сеть с этой подсетью;
#   base       — открывает в firewall порт node_exporter только для неё;
#   monitoring — node_exporter слушает адрес шлюза этой сети, Prometheus опрашивает его там же.
# Диапазон 172.16.0.0/12 — частный (RFC 1918); в локальной сети и в tailnet таких адресов нет.
monitoring_subnet: 172.30.0.0/24
monitoring_gateway: 172.30.0.1
monitoring_node_exporter_port: 9100
