---
- name: Обновить список пакетов
  ansible.builtin.apt:
    update_cache: true

# Перезапуск демона перезапускает и контейнеры (поднимутся сами, если у них задан restart).
# Поэтому он срабатывает только при изменении daemon.json, а не при каждом прогоне.
- name: Перезапустить Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
