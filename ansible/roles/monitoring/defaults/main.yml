---
# Образы: тег для человека, digest — для воспроизводимости (docker использует именно его).
# Обновление: crane digest prom/prometheus:<версия> — и так же для остальных.
monitoring_prometheus_image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
monitoring_node_exporter_image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
monitoring_blackbox_image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
# cAdvisor: с версии 0.53 образы публикуются в GHCR (в gcr.io остались только старые)
monitoring_cadvisor_image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
monitoring_grafana_image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
monitoring_alertmanager_image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c

# Каталог с compose.yaml и конфигурацией на сервере
monitoring_dir: /opt/monitoring

# Адрес, по которому Prometheus открывается через обратный прокси (сайт описан в роли proxy)
monitoring_prometheus_url: https://prometheus.home.arpa/

# Grafana: адрес через обратный прокси (сайт описан в роли proxy) и учётная запись администратора.
# Пароль — из файла с секретами вне репозитория (vault.example.yml); значения по умолчанию у него нет.
# Он задаётся только при первом запуске с пустым томом; сменить позже:
#   docker compose -f /opt/monitoring/compose.yaml exec grafana grafana cli admin reset-admin-password <новый>
monitoring_grafana_url: https://grafana.home.arpa/
monitoring_grafana_admin_user: admin
monitoring_grafana_admin_password: "{{ vault_grafana_admin_password }}"
# Дашборд, который открывается на главной странице (файл из files/grafana/dashboards)
monitoring_grafana_home_dashboard: site.json
# Пользователь, от которого Grafana работает в образе: ему должен быть доступен файл с паролем
monitoring_grafana_uid: "472"
# Измерено на сервере: около 300 МБ сразу после запуска и до 350 МБ при открытых дашбордах
monitoring_grafana_memory_limit: 512m
monitoring_grafana_pids_limit: 256

# Как часто собирать метрики. 30 с вместо привычных 15: вдвое меньше записи на диск,
# а для домашнего сервера такой точности достаточно.
monitoring_scrape_interval: 30s

# Как часто Prometheus повторяет отправку активных алертов в Alertmanager. По умолчанию 1m, но
# условие «с прошлой отправки прошло больше 1m» при вычислении правил раз в 30 с выполняется только
# через 90 с — ровно столько (90 с, в коде не настраивается) Alertmanager держит простаивающее
# соединение. Он закрывал его в ту же миллисекунду, когда Prometheus снова в него писал: около 10 %
# отправок падали с EOF, и эти алерты терялись (найдено по логам 26.11.2026). С 45s повтор идёт каждые
# 60 с, и соединение до 90 с не простаивает. Значение должно давать период повтора меньше 90 с.
monitoring_alert_resend_delay: 45s

# Хранение: срабатывает то ограничение, которое наступит раньше. Диск сервера не новый —
# объём записи ограничен намеренно.
monitoring_retention_time: 15d
monitoring_retention_size: 2GB

# Имя сервера в метках метрик (вместо адреса шлюза сети Docker)
monitoring_node_name: "{{ inventory_hostname }}"

# Проверки blackbox_exporter: «снаружи», по HTTPS, как видит сайт браузер.
# Внутренние — сайты за обратным прокси (сертификат выпущен центром сертификации Caddy).
monitoring_probes_internal:
  - https://air-gis.home.arpa/healthz
  - https://air-gis.home.arpa/
# Публичные — сайты в интернете с обычными сертификатами: демо на GitHub Pages.
monitoring_probes_public:
  - https://mellaque.github.io/chelyabinsk-air-gis/

# Метрики обратного прокси: имя сервиса Caddy в сети monitoring и порт (proxy_metrics_port в роли proxy)
monitoring_caddy_metrics_target: caddy:9180

# cAdvisor — метрики контейнеров. Какие группы метрик собирать: по умолчанию их гораздо больше
# (процессы, TCP, планировщик…), и почти все они здесь не нужны, а стоят памяти и места в базе.
monitoring_cadvisor_metrics:
  - cpu
  - memory
  - network
  - diskIO
# Как часто cAdvisor опрашивает контейнеры. По умолчанию — раз в секунду; чаще, чем Prometheus
# забирает метрики, смысла нет.
monitoring_cadvisor_interval: "{{ monitoring_scrape_interval }}"
# Какие метки контейнеров попадают в метрики. Все метки не нужны: это десятки лишних меток на серию.
monitoring_cadvisor_labels:
  - com.docker.compose.project
  - com.docker.compose.service
monitoring_cadvisor_memory_limit: 192m

# compose.yaml обратного прокси и путь к корневому сертификату его центра сертификации
# внутри контейнера (каталоги те же, что proxy_dir и proxy_ca_container_dir в роли proxy).
# Не из тома /data: если корень задан в конфигурации, Caddy в том его не записывает
monitoring_proxy_compose_file: /opt/proxy/compose.yaml
monitoring_proxy_root_cert: /etc/caddy-ca/root.crt

# Ограничения контейнеров
monitoring_prometheus_memory_limit: 768m
monitoring_prometheus_cpus: "1.00"
monitoring_exporter_memory_limit: 64m
monitoring_exporter_cpus: "0.25"
monitoring_pids_limit: 128

# Сколько секунд ждать запуска контейнеров и первого опроса всех целей
monitoring_wait_timeout: 120

# Alertmanager: получает алерты от Prometheus, группирует их и отправляет уведомления в ntfy.
# Адрес через обратный прокси (сайт описан в роли proxy) — там видны активные алерты и ставятся
# «заглушки» (silences) на время работ.
monitoring_alertmanager_url: https://alertmanager.home.arpa/
# Пользователь, от которого Alertmanager работает в образе (nobody): ему должен быть доступен файл с адресом канала
monitoring_alertmanager_uid: "65534"
monitoring_alertmanager_memory_limit: 128m

# Алерты с одинаковыми именем и важностью приходят одним уведомлением (например, SiteDown для
# главной страницы и /healthz).
#   group_wait      — сколько ждать после первого алерта группы, не появятся ли ещё;
#   group_interval  — как часто сообщать об изменениях в группе (в том числе об исправлении);
#   repeat_interval — через сколько напомнить, если ничего не изменилось.
monitoring_alert_group_wait: 10s
monitoring_alert_group_interval: 1m
monitoring_alert_repeat_interval: 12h
monitoring_alert_repeat_interval_critical: 4h

# Канал ntfy — из файла с секретами вне репозитория (vault.example.yml): имя канала и есть пароль
# к нему. Значения по умолчанию нет.
monitoring_ntfy_topic_url: "{{ vault_ntfy_topic_url }}"

# Как выглядит уведомление. Alertmanager отправляет в ntfy свой обычный JSON (webhook), а заголовок,
# текст и приоритет из него собирает сам сервер ntfy по этим шаблонам — они передаются в адресе.
# Это шаблоны Go, а не Jinja: метка !unsafe запрещает Ansible их вычислять. «\n» — перевод строки.
# Поля: .status (firing или resolved — у группы и у каждого алерта), .alerts, .commonLabels,
# .commonAnnotations (метки и аннотации, одинаковые у всех алертов группы).
monitoring_ntfy_title: !unsafe >-
  {{if eq .status "resolved"}}✅ Исправлено: {{else if eq .commonLabels.severity "critical"}}🚨 {{else if
  eq .commonLabels.severity "info"}}ℹ️ {{else}}⚠️ {{end}}{{.commonLabels.alertname}}
# Сначала — краткая строка каждого алерта (исправленные отмечены), затем описание: общее, если оно
# у всех одинаковое, иначе — каждого
monitoring_ntfy_message: !unsafe >-
  {{range .alerts}}{{if eq .status "resolved"}}✅ {{end}}{{.annotations.summary}}\n{{end}}{{if
  eq .status "firing"}}{{if .commonAnnotations.description}}{{.commonAnnotations.description}}{{else}}{{range
  .alerts}}{{.annotations.description}}\n{{end}}{{end}}{{end}}
# Приоритет ntfy: critical — высокий (но не высший: он пробивает «Не беспокоить»), info — низкий,
# остальное и сообщения об исправлении — обычный
monitoring_ntfy_priority: !unsafe >-
  {{if eq .status "resolved"}}default{{else if eq .commonLabels.severity "critical"}}high{{else if
  eq .commonLabels.severity "info"}}low{{else}}default{{end}}

# Внешний «будильник» (dead man's switch): сервис вне сервера, который ждёт регулярный сигнал
# и сам сообщает, когда тот перестал приходить; подойдёт любой, что принимает POST. Адрес для сигналов —
# из файла с секретами (vault.example.yml): кто его знает, может слать сигналы вместо сервера.
monitoring_heartbeat_url: "{{ vault_heartbeat_url }}"
# Как часто отправлять сигнал. В сервисе период ожидания должен быть не меньше:
# для 4m — период 5 минут и ещё 5 минут запаса (grace), тревога через 10 минут тишины.
monitoring_heartbeat_interval: 4m
