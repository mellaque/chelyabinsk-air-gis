---
# Правила алертов: сам мониторинг. Файл копируется на сервер как есть: {{ … }} — шаблоны Prometheus.
groups:
  - name: monitoring
    rules:
      # «Будильник наоборот»: этот алерт активен всегда. Alertmanager каждые несколько минут отправляет
      # его внешнему сервису (маршрут — в alertmanager.yml), а тот поднимает тревогу, когда сигналы
      # прекратились. Так обнаруживается то, о чём сам сервер сообщить не может: он выключен, нет
      # интернета, не работает Prometheus или Alertmanager. В ntfy этот алерт не попадает.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Сигнал «мониторинг работает»"
          description: "Активен всегда — так и должно быть. Тревогу поднимает внешний сервис, если сигнал перестал приходить."

      # up — метрика, которую Prometheus сам записывает для каждой цели: 1 — опрос удался, 0 — нет.
      # Для проверок сайтов (job blackbox_http) up == 0 означает, что не отвечает сам blackbox_exporter:
      # метрики probe_success тогда нет вовсе, и SiteDown молчит — поэтому этот алерт обязателен.
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus не может опросить {{ $labels.job }} ({{ $labels.instance }})"
          description: "Метрики не собираются 2 минуты. Смотреть: docker ps -a на сервере и журнал контейнера."

      # Конфигурация перечитывается по SIGHUP; при ошибке в файле Prometheus молча остаётся на прежней
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus не смог перечитать конфигурацию"
          description: "Работает прежняя конфигурация. Смотреть: docker compose -f /opt/monitoring/compose.yaml logs prometheus."

      # Если уведомления не уходят, сообщить об этом тем же путём нельзя — алерт виден только в
      # интерфейсе Prometheus и Alertmanager.
      - alert: AlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager не может отправить уведомления ({{ $labels.integration }})"
          description: "Смотреть: docker logs monitoring-alertmanager-1, доступность ntfy.sh с сервера."

      # Участок Prometheus → Alertmanager: алерт, который не удалось отправить, Prometheus отбрасывает
      # (повторит только через resend-delay). AlertmanagerNotificationsFailing этого не видит — он про
      # следующий участок, Alertmanager → ntfy. Окно — час: ошибки 26.11 шли раз в 3–20 минут и в
      # коротком окне то появлялись, то пропадали. Порог 5 %: одна ошибка за час (Alertmanager
      # пересоздали при выкатке) — около 2 %, алерта нет.
      - alert: PrometheusNotificationsFailing
        expr: |
          rate(prometheus_notifications_errors_total[1h])
            / (rate(prometheus_notifications_sent_total[1h]) + rate(prometheus_notifications_errors_total[1h]))
            > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus не может отправить часть алертов в Alertmanager"
          description: "С ошибкой {{ $value | humanizePercentage }} отправок за час, эти алерты теряются. Смотреть: docker logs monitoring-prometheus-1."

      - alert: AlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager не смог перечитать конфигурацию"
          description: "Работает прежняя конфигурация. Смотреть: docker logs monitoring-alertmanager-1."

      # Правило с ошибкой при вычислении (например, деление «многие ко многим») не срабатывает никогда
      - alert: PrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Правила Prometheus вычисляются с ошибками: группа {{ $labels.rule_group }}"
          description: "Часть алертов сейчас не работает. Смотреть: страница /rules в Prometheus."
