---
# Тесты правил алертов: promtool test rules (запуск — scripts/test_alert_rules.sh, в CI — тоже он).
# На вход подаются придуманные ряды метрик, на выходе проверяется, какие алерты и когда активны.
# Зачем: правило с опечаткой в имени метрики или метки синтаксически верно — и не сработает никогда.
#
# Запись значений: «1x4» — значение 1 и ещё четыре раза оно же; «0+10x5» — от 0 с шагом 10;
# «_» — значения нет; stale — ряд пропал (цель перестала отдавать метрику).
# Метки рядов — такие же, как на сервере.
rule_files:
  - ../../files/prometheus/rules/*.yml

evaluation_interval: 30s

tests:
  # --- Сайт -------------------------------------------------------------------------------------
  - name: Одна неудачная проверка алерт не вызывает, две подряд — вызывают; после починки алерт гаснет
    interval: 30s
    input_series:
      # 0 с…: ок, ок, ОШИБКА, ок, ок, ОШИБКА, ОШИБКА, ОШИБКА, ок, ок
      - series: 'probe_success{job="blackbox_http", module="http_internal", instance="https://air-gis.home.arpa/healthz"}'
        values: "1 1 0 1 1 0 0 0 1 1"
    alert_rule_test:
      - eval_time: 1m30s        # после одиночной ошибки
        alertname: SiteDown
        exp_alerts: []
      - eval_time: 2m30s        # первая ошибка из серии: алерт ещё только pending
        alertname: SiteDown
        exp_alerts: []
      - eval_time: 3m           # вторая подряд — firing
        alertname: SiteDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox_http
              module: http_internal
              instance: https://air-gis.home.arpa/healthz
            exp_annotations:
              summary: "Сайт не отвечает: https://air-gis.home.arpa/healthz"
              description: "Проверка по HTTPS через обратный прокси не проходит. Смотреть: контейнеры air-gis-web-1 и proxy-caddy-1, дашборд «Сайт»."
      - eval_time: 4m           # проверка снова проходит
        alertname: SiteDown
        exp_alerts: []

  - name: Публичное демо — алерт только после пяти минут недоступности, и это не SiteDown
    interval: 30s
    input_series:
      - series: 'probe_success{job="blackbox_http", module="http_public", instance="https://mellaque.github.io/chelyabinsk-air-gis/"}'
        values: "1 0x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: PublicSiteDown
        exp_alerts: []
      - eval_time: 5m30s
        alertname: PublicSiteDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox_http
              module: http_public
              instance: https://mellaque.github.io/chelyabinsk-air-gis/
            exp_annotations:
              summary: "Публичное демо не отвечает: https://mellaque.github.io/chelyabinsk-air-gis/"
              description: "Проверка не проходит 5 минут подряд. Смотреть: статус GitHub Pages и последний запуск публикации в Actions."
      - eval_time: 5m30s
        alertname: SiteDown
        exp_alerts: []

  - name: Сертификаты — внутренний с запасом 10 часов и публичный на 40 дней в норме; 1 час и 5 дней — нет
    interval: 1m
    input_series:
      # Срок считается от времени теста (оно начинается с нуля): 36000 с = 10 ч, 3600 с = 1 ч
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox_http", module="http_internal", instance="https://ok.home.arpa/"}'
        values: "36000x120"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox_http", module="http_internal", instance="https://bad.home.arpa/"}'
        values: "3600x120"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox_http", module="http_public", instance="https://ok.example/"}'
        values: "3456000x120"
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox_http", module="http_public", instance="https://bad.example/"}'
        values: "432000x120"
    alert_rule_test:
      - eval_time: 15m
        alertname: InternalCertNotRenewed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox_http
              module: http_internal
              instance: https://bad.home.arpa/
            exp_annotations:
              summary: "Сертификат не обновляется: https://bad.home.arpa/"
              description: "До конца срока 0.8 ч, а Caddy должен был выпустить новый. Смотреть: docker logs proxy-caddy-1."
      - eval_time: 1h30m
        alertname: PublicCertExpiring
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox_http
              module: http_public
              instance: https://bad.example/
            exp_annotations:
              summary: "Сертификат скоро истечёт: https://bad.example/"
              description: "До конца срока 5 дн."

  # --- Мониторинг ---------------------------------------------------------------------------------
  - name: Цель не опрашивается две минуты — TargetDown; остальные цели не затронуты
    interval: 30s
    input_series:
      - series: 'up{job="cadvisor", instance="cadvisor:8080"}'
        values: "1 0x10"
      - series: 'up{job="node", instance="homelab"}'
        values: "1x11"
    alert_rule_test:
      - eval_time: 2m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 2m30s
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: cadvisor
              instance: cadvisor:8080
            exp_annotations:
              summary: "Prometheus не может опросить cadvisor (cadvisor:8080)"
              description: "Метрики не собираются 2 минуты. Смотреть: docker ps -a на сервере и журнал контейнера."

  - name: Watchdog активен всегда — даже когда нет ни одной метрики
    interval: 30s
    alert_rule_test:
      - eval_time: 0m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "Сигнал «мониторинг работает»"
              description: "Активен всегда — так и должно быть. Тревогу поднимает внешний сервис, если сигнал перестал приходить."

  - name: Alertmanager не смог отправить уведомление — алерт сразу; счётчик стоит — алерта нет
    interval: 30s
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="webhook", reason="other"}'
        values: "0x10 1x30"
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="alertmanager:9093", integration="email", reason="other"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 4m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 6m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: alertmanager
              instance: alertmanager:9093
              integration: webhook
              reason: other
            exp_annotations:
              summary: "Alertmanager не может отправить уведомления (webhook)"
              description: "Смотреть: docker logs monitoring-alertmanager-1, доступность ntfy.sh с сервера."

  # Как было 26.11: отправка раз в 90 с, около 10 % — с ошибкой (EOF)
  - name: Prometheus теряет 10 % отправок в Alertmanager — алерт через 15 минут
    interval: 1m
    input_series:
      - series: 'prometheus_notifications_sent_total{alertmanager="http://alertmanager:9093/api/v2/alerts", instance="127.0.0.1:9090", job="prometheus"}'
        values: "0+0.6x60"
      - series: 'prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts", instance="127.0.0.1:9090", job="prometheus"}'
        values: "0+0.07x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: PrometheusNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              alertmanager: http://alertmanager:9093/api/v2/alerts
              instance: 127.0.0.1:9090
              job: prometheus
            exp_annotations:
              summary: "Prometheus не может отправить часть алертов в Alertmanager"
              description: "С ошибкой 10.45% отправок за час, эти алерты теряются. Смотреть: docker logs monitoring-prometheus-1."

  - name: Одна ошибка отправки за час (Alertmanager пересоздан при выкатке) алерта не вызывает
    interval: 1m
    input_series:
      - series: 'prometheus_notifications_sent_total{alertmanager="http://alertmanager:9093/api/v2/alerts", instance="127.0.0.1:9090", job="prometheus"}'
        values: "0+1x60"
      - series: 'prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts", instance="127.0.0.1:9090", job="prometheus"}'
        values: "0x20 1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []
      - eval_time: 60m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []

  # --- Сервер -------------------------------------------------------------------------------------
  - name: Место на диске — 10 % свободно это warning, 3 % — ещё и critical; /boot с 78 % в норме
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node", instance="homelab", device="/dev/mapper/homelab--vg-root", fstype="ext4", mountpoint="/"}'
        values: "1000x30"
      - series: 'node_filesystem_avail_bytes{job="node", instance="homelab", device="/dev/mapper/homelab--vg-root", fstype="ext4", mountpoint="/"}'
        values: "100x15 30x15"
      - series: 'node_filesystem_size_bytes{job="node", instance="homelab", device="/dev/sda2", fstype="ext4", mountpoint="/boot"}'
        values: "1000x30"
      - series: 'node_filesystem_avail_bytes{job="node", instance="homelab", device="/dev/sda2", fstype="ext4", mountpoint="/boot"}'
        values: "780x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: DiskSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: homelab
              device: /dev/mapper/homelab--vg-root
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Мало места на /"
              description: "Свободно 10%. Смотреть: docker system df, старые образы, журналы."
      - eval_time: 12m
        alertname: DiskSpaceCritical
        exp_alerts: []
      - eval_time: 25m
        alertname: DiskSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: homelab
              device: /dev/mapper/homelab--vg-root
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Место на / заканчивается"
              description: "Свободно 3%."

  - name: Питание — батарея на 58 % при работе от сети это норма; без сети — OnBattery, ниже 30 % — BatteryLow
    interval: 30s
    input_series:
      - series: 'node_power_supply_online{job="node", instance="homelab", power_supply="ADP1"}'
        values: "1x4 0x20"
      - series: 'node_power_supply_capacity{job="node", instance="homelab", power_supply="BAT0"}'
        values: "58x4 58-2x20"
    alert_rule_test:
      - eval_time: 2m
        alertname: OnBattery
        exp_alerts: []
      - eval_time: 2m
        alertname: BatteryLow
        exp_alerts: []
      - eval_time: 4m30s
        alertname: OnBattery
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: homelab
              power_supply: ADP1
            exp_annotations:
              summary: "Сервер работает от батареи"
              description: "Нет питания от сети. Смотреть: блок питания и розетку."
      - eval_time: 12m
        alertname: BatteryLow
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: homelab
              power_supply: BAT0
            exp_annotations:
              summary: "Батарея сервера разряжается: 20 %"
              description: "Сервер скоро выключится."

  - name: OOM kill — счётчик вырос, алерт сразу; счётчик стоит — алерта нет
    interval: 30s
    input_series:
      - series: 'node_vmstat_oom_kill{job="node", instance="homelab"}'
        values: "0x10 1x30"
    alert_rule_test:
      - eval_time: 4m
        alertname: OomKill
        exp_alerts: []
      - eval_time: 6m
        alertname: OomKill
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: homelab
            exp_annotations:
              summary: "Ядро завершило процесс из-за нехватки памяти"
              description: "Смотреть: journalctl -k | grep -i oom — там видно, какой контейнер."
      - eval_time: 18m          # через 10 минут после события алерт гаснет сам
        alertname: OomKill
        exp_alerts: []

  # --- Контейнеры ---------------------------------------------------------------------------------
  - name: Память контейнера — 95 % лимита это алерт; 70 % и контейнер без лимита (0) — нет
    interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{job="cadvisor", instance="cadvisor:8080", name="monitoring-grafana-1"}'
        values: "510027366x20"
      - series: 'container_spec_memory_limit_bytes{job="cadvisor", instance="cadvisor:8080", name="monitoring-grafana-1"}'
        values: "536870912x20"
      - series: 'container_memory_working_set_bytes{job="cadvisor", instance="cadvisor:8080", name="monitoring-prometheus-1"}'
        values: "563714457x20"
      - series: 'container_spec_memory_limit_bytes{job="cadvisor", instance="cadvisor:8080", name="monitoring-prometheus-1"}'
        values: "805306368x20"
      - series: 'container_memory_working_set_bytes{job="cadvisor", instance="cadvisor:8080", name="uptime-kuma"}'
        values: "238346240x20"
      - series: 'container_spec_memory_limit_bytes{job="cadvisor", instance="cadvisor:8080", name="uptime-kuma"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              job: cadvisor
              instance: cadvisor:8080
              name: monitoring-grafana-1
            exp_annotations:
              summary: "Контейнер monitoring-grafana-1 близок к лимиту памяти"
              description: "Занято 95% лимита. Дальше — OOM kill и перезапуск. Лимиты задаются в defaults ролей."

  - name: Перезапуски — два за 15 минут это алерт, один (ручной) — нет
    interval: 1m
    input_series:
      - series: 'container_start_time_seconds{job="cadvisor", instance="cadvisor:8080", name="air-gis-web-1"}'
        values: "1000x5 1300x3 1500x10"
      - series: 'container_start_time_seconds{job="cadvisor", instance="cadvisor:8080", name="proxy-caddy-1"}'
        values: "1000x5 1300x14"
    alert_rule_test:
      - eval_time: 12m
        alertname: ContainerRestarting
        exp_alerts:
          - exp_labels:
              severity: warning
              job: cadvisor
              instance: cadvisor:8080
              name: air-gis-web-1
            exp_annotations:
              summary: "Контейнер air-gis-web-1 перезапускается"
              description: "Запусков за 15 минут: 2. Смотреть: docker logs air-gis-web-1."
