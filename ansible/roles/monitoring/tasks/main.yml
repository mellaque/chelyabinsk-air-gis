---
# Мониторинг: Prometheus собирает метрики и вычисляет правила алертов, Alertmanager отправляет
# уведомления в ntfy, node_exporter отдаёт метрики хоста, cAdvisor — метрики
# контейнеров, blackbox_exporter проверяет сайты запросами по HTTPS; свои метрики отдаёт и обратный
# прокси. Grafana показывает всё это на дашбордах. Prometheus и Grafana открываются через обратный прокси.
# Конфигурацию перед заменой проверяют сами программы из тех же образов (promtool, --config.check).

- name: Сеть мониторинга описана
  ansible.builtin.assert:
    that:
      - monitoring_subnet is defined
      - monitoring_gateway is defined
      - monitoring_node_exporter_port is defined
    fail_msg: "monitoring_subnet, monitoring_gateway и monitoring_node_exporter_port задаются в group_vars/all.yml"
    quiet: true

# Значение не выводится: при ошибке видно только, какое из условий не выполнено
- name: Пароль администратора Grafana задан
  ansible.builtin.assert:
    that:
      - vault_grafana_admin_password is defined
      - vault_grafana_admin_password | length >= 12
      - "'заменить' not in vault_grafana_admin_password"
    fail_msg: >-
      Нужен файл с секретами (образец — vault.example.yml) и пароль не короче 12 символов:
      ansible-playbook playbook.yml -K -e @$HOME/.config/air-gis/vault.yml --ask-vault-pass
    quiet: true

# Значение не выводится. Имя канала ntfy — секрет: кто его знает, тот читает и пишет в канал
- name: Адрес канала ntfy задан
  ansible.builtin.assert:
    that:
      - vault_ntfy_topic_url is defined
      - vault_ntfy_topic_url is match('https://[^/?#]+/[^/?#]+$')
      - "'заменить' not in vault_ntfy_topic_url"
    fail_msg: >-
      В файле с секретами нужен vault_ntfy_topic_url вида https://ntfy.sh/имя-канала (образец — vault.example.yml):
      ansible-vault edit ~/.config/air-gis/vault.yml
    quiet: true

- name: Адрес внешнего «будильника» задан
  ansible.builtin.assert:
    that:
      - vault_heartbeat_url is defined
      - vault_heartbeat_url is match('https://[^/?#]+/.+')
      - "'заменить' not in vault_heartbeat_url"
    fail_msg: >-
      В файле с секретами нужен vault_heartbeat_url — адрес для сигналов «мониторинг работает»
      (образец — vault.example.yml): ansible-vault edit ~/.config/air-gis/vault.yml
    quiet: true

- name: Каталоги конфигурации
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - prometheus
    - prometheus/rules
    - alertmanager
    - blackbox
    - grafana

- name: Каталог секретов
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Файл читает только пользователь, от которого Grafana работает в контейнере
- name: Пароль администратора Grafana — файл для контейнера
  ansible.builtin.copy:
    content: "{{ monitoring_grafana_admin_password }}"
    dest: "{{ monitoring_dir }}/secrets/grafana-admin-password"
    owner: "{{ monitoring_grafana_uid }}"
    group: root
    mode: "0400"
  no_log: true   # иначе пароль попал бы в вывод и в diff

# Каталог монтируется в контейнер целиком; читает его только пользователь Alertmanager
- name: Каталог секретов Alertmanager
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/secrets/alertmanager"
    state: directory
    owner: "{{ monitoring_alertmanager_uid }}"
    group: root
    mode: "0500"

# Адрес, на который Alertmanager отправляет уведомления: канал ntfy и шаблоны заголовка, текста
# и приоритета (их применяет сервер ntfy). Перезапуск не нужен: файл читается при каждой отправке.
- name: Адрес канала ntfy — файл для Alertmanager
  ansible.builtin.copy:
    content: >-
      {{ monitoring_ntfy_topic_url }}?template=yes&priority={{ monitoring_ntfy_priority | urlencode
      }}&title={{ monitoring_ntfy_title | urlencode }}&message={{ monitoring_ntfy_message | urlencode }}
    dest: "{{ monitoring_dir }}/secrets/alertmanager/ntfy-url"
    owner: "{{ monitoring_alertmanager_uid }}"
    group: root
    mode: "0400"
  no_log: true   # иначе имя канала попало бы в вывод и в diff

- name: Адрес внешнего «будильника» — файл для Alertmanager
  ansible.builtin.copy:
    content: "{{ monitoring_heartbeat_url }}"
    dest: "{{ monitoring_dir }}/secrets/alertmanager/heartbeat-url"
    owner: "{{ monitoring_alertmanager_uid }}"
    group: root
    mode: "0400"
  no_log: true

# Источник данных Grafana читает только при запуске — после изменения нужен перезапуск (ниже)
- name: Grafana — источник данных и поставщик дашбордов
  ansible.builtin.copy:
    src: grafana/provisioning/
    dest: "{{ monitoring_dir }}/grafana/provisioning/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  register: monitoring_grafana_provisioning

# Файлы дашбордов Grafana перечитывает сама, перезапуск не нужен
- name: Grafana — дашборды
  ansible.builtin.copy:
    src: grafana/dashboards/
    dest: "{{ monitoring_dir }}/grafana/dashboards/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

# Сайты за обратным прокси подписаны его собственным центром сертификации. Чтобы blackbox
# проверял и сертификат, ему нужен корневой сертификат — только он, без ключей: том caddy_data
# целиком монтировать нельзя, в нём лежит ключ центра сертификации.
- name: Корневой сертификат обратного прокси — прочитать
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ monitoring_proxy_compose_file }}"
      - exec
      - --no-TTY
      - caddy
      - cat
      - "{{ monitoring_proxy_root_cert }}"
  register: monitoring_root_cert
  changed_when: false
  check_mode: false   # только читает — выполняется и при --check
  # При --check на чистом сервере прокси ещё не запущен — это не ошибка
  failed_when:
    - not ansible_check_mode
    - monitoring_root_cert.rc != 0 or '-----BEGIN CERTIFICATE-----' not in monitoring_root_cert.stdout

- name: Корневой сертификат обратного прокси — для blackbox_exporter
  ansible.builtin.copy:
    content: "{{ monitoring_root_cert.stdout | trim }}\n"
    dest: "{{ monitoring_dir }}/blackbox/caddy-root.crt"
    owner: root
    group: root
    mode: "0644"
  when: monitoring_root_cert.rc == 0
  notify: Перечитать конфигурацию blackbox_exporter

# В образах программы работают от nobody, а временный файл Ansible доступен только root —
# поэтому проверка запускается с --user 0:0 (без сети и только на время проверки)
- name: Конфигурация blackbox_exporter
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ monitoring_dir }}/blackbox/blackbox.yml"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm --network none --user 0:0
      --volume {{ monitoring_dir }}/blackbox:/etc/blackbox:ro --volume %s:/tmp/blackbox.yml:ro
      {{ monitoring_blackbox_image }} --config.check --config.file=/tmp/blackbox.yml
  notify: Перечитать конфигурацию blackbox_exporter

- name: Конфигурация Alertmanager
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ monitoring_dir }}/alertmanager/alertmanager.yml"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm --network none --user 0:0 --entrypoint /bin/amtool
      --volume %s:/tmp/alertmanager.yml:ro
      {{ monitoring_alertmanager_image }} check-config /tmp/alertmanager.yml
  notify: Перечитать конфигурацию Alertmanager

# Правила алертов — обычные файлы, а не шаблоны: внутри есть {{ … }} для текста уведомлений,
# это шаблоны Prometheus. Каждый файл перед заменой проверяет promtool из того же образа.
- name: Правила алертов
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ monitoring_dir }}/prometheus/rules/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm --network none --user 0:0 --entrypoint /bin/promtool
      --volume %s:/tmp/rules.yml:ro
      {{ monitoring_prometheus_image }} check rules /tmp/rules.yml
  loop: "{{ monitoring_rule_files }}"
  loop_control:
    label: "{{ item | basename }}"
  notify: Перечитать конфигурацию Prometheus

# Prometheus читает все файлы каталога: переименованный или удалённый из роли файл остался бы
# на сервере, и его правила продолжали бы работать
- name: Правила алертов — какие файлы есть на сервере
  ansible.builtin.find:
    paths: "{{ monitoring_dir }}/prometheus/rules"
    patterns: "*.yml"
  register: monitoring_rules_present

- name: Правила алертов — лишние файлы удалены
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ monitoring_rules_present.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in (monitoring_rule_files | map('basename'))
  notify: Перечитать конфигурацию Prometheus

- name: Конфигурация Prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm --network none --user 0:0 --entrypoint /bin/promtool
      --volume %s:/tmp/prometheus.yml:ro
      {{ monitoring_prometheus_image }} check config /tmp/prometheus.yml
  notify: Перечитать конфигурацию Prometheus

- name: Описание сервисов — compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ monitoring_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
    validate: docker compose -f %s config --quiet
  register: monitoring_compose

- name: Какие сервисы работают
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ monitoring_dir }}/compose.yaml", ps, --status, running, --services]
  register: monitoring_running
  changed_when: false
  failed_when: false
  check_mode: false

# Запуск нужен, если изменилось описание или работают не все контейнеры.
# --wait ждёт, пока Prometheus станет healthy (у экспортёров healthcheck нет — см. compose.yaml).
- name: Мониторинг запущен
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ monitoring_dir }}/compose.yaml"
      - up
      - --detach
      - --wait
      - --wait-timeout
      - "{{ monitoring_wait_timeout }}"
  changed_when: true
  when: monitoring_compose is changed or (monitoring_running.stdout_lines | default([]) | length) < monitoring_services

# Только если Grafana уже работала до этого прогона: только что созданная прочитает файлы сама,
# а перезапуск во время первого запуска прервал бы создание её базы
- name: Grafana перезапущена, если изменился источник данных
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ monitoring_dir }}/compose.yaml", restart, grafana]
  changed_when: true
  when:
    - monitoring_grafana_provisioning is changed
    - "'grafana' in (monitoring_running.stdout_lines | default([]))"

# Конфигурация должна быть перечитана до проверки целей, а не в конце прогона
- name: Конфигурация перечитана, если она изменилась
  ansible.builtin.meta: flush_handlers

# Итог роли проверяется самим Prometheus: метрика up равна 1 у каждой цели, которую он смог
# опросить. Целей должно быть ровно столько, сколько описано; после запуска первый опрос
# занимает до одного интервала, поэтому проверка повторяется.
- name: Prometheus опрашивает все цели
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ monitoring_dir }}/compose.yaml"
      - exec
      - --no-TTY
      - prometheus
      - promtool
      - query
      - instant
      - http://127.0.0.1:9090
      - count(up == 1)
  register: monitoring_targets_up
  changed_when: false
  check_mode: false
  retries: "{{ (monitoring_wait_timeout | int / 5) | int }}"
  delay: 5
  until: >-
    monitoring_targets_up.rc == 0 and
    (monitoring_targets_up.stdout | regex_findall('=> ([0-9]+) ') | first | default('0') | int)
    == monitoring_targets_expected | int
  # При --check на чистом сервере контейнеров ещё нет
  when: not ansible_check_mode or (monitoring_running.stdout_lines | default([]) | length) == monitoring_services
  vars:
    # Prometheus, Alertmanager, node_exporter, blackbox_exporter, cAdvisor, Caddy, Grafana
    # и по одной цели на каждую проверку
    monitoring_targets_expected: "{{ 7 + (monitoring_probes_internal | length) + (monitoring_probes_public | length) }}"

# Вторая половина той же проверки: при ошибке в файле правил Prometheus после SIGHUP молча остаётся
# на прежней конфигурации. Поэтому число загруженных правил сверяется с числом правил в файлах роли.
- name: Prometheus загрузил все правила алертов
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ monitoring_dir }}/compose.yaml"
      - exec
      - --no-TTY
      - prometheus
      - promtool
      - query
      - instant
      - http://127.0.0.1:9090
      - sum(prometheus_rule_group_rules)
  register: monitoring_rules_loaded
  changed_when: false
  check_mode: false
  retries: "{{ (monitoring_wait_timeout | int / 5) | int }}"
  delay: 5
  until: >-
    monitoring_rules_loaded.rc == 0 and
    (monitoring_rules_loaded.stdout | regex_findall('=> ([0-9]+) ') | first | default('0') | int)
    == monitoring_rules_expected | int
  # При --check правила на сервер ещё не скопированы
  when: not ansible_check_mode
  vars:
    monitoring_rules_expected: >-
      {%- set total = namespace(rules=0) -%}
      {%- for rule_file in monitoring_rule_files -%}
      {%- for rule_group in (lookup('ansible.builtin.file', rule_file) | from_yaml)['groups'] -%}
      {%- set total.rules = total.rules + (rule_group['rules'] | length) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ total.rules }}
