---
# Образ Caddy: тег для человека, digest — для воспроизводимости (docker использует именно его).
# Обновление: crane digest caddy:<версия>-alpine
proxy_image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee

# Каталог с compose.yaml и конфигурацией на сервере
proxy_dir: /opt/proxy

# Корень собственного центра сертификации — сертификат и ключ в PEM из файла с секретами
# (образец — vault.example.yml). Caddy подписывает им промежуточный сертификат, а тот — сертификаты
# сайтов. Корень не генерируется на сервере: сервер, восстановленный с нуля, выдаёт сертификаты,
# которым устройства уже доверяют, и корневой сертификат не надо ставить на них заново.
proxy_ca_root_cert: "{{ vault_caddy_root_cert }}"
proxy_ca_root_key: "{{ vault_caddy_root_key }}"
# Где корень лежит внутри контейнера (на хосте — {{ proxy_dir }}/ca)
proxy_ca_container_dir: /etc/caddy-ca

# Общие сети Docker, к которым подключён прокси (их создаёт роль docker).
# site_aliases: внутри этой сети имена сайтов указывают на сам прокси. Так blackbox_exporter
# проверяет сайты по настоящим именам и по HTTPS, не завися от DNS домашней сети.
proxy_networks:
  - name: proxy
  - name: monitoring
    site_aliases: true

# Адреса устройств в VPN: IPv4 из 100.64.0.0/10 (RFC 6598) и IPv6-префикс сети VPN
proxy_vpn_sources:
  - 100.64.0.0/10
  - fd7a:115c:a1e0::/48

# Сайты: имя → контейнер в общей сети. Домен home.arpa зарезервирован для домашних сетей (RFC 8375).
# allowed_sources — с каких адресов сайт доступен; остальным прокси отвечает 403.
# У Prometheus и Alertmanager нет своей авторизации, поэтому они открыты только устройствам VPN.
#
# Условие для allowed_sources с адресами VPN: VPN-клиент на сервере не должен подменять адрес
# источника (SNAT) у пакетов, которые он пересылает из туннеля, в том числе в контейнеры. Иначе прокси
# видит адрес шлюза сети Docker, и 403 получают все. VPN этим плейбуком не настраивается — это ручной
# шаг, см. docs/runbook-restore.md (шаг 5). Адрес шлюза Docker в список не добавлять: это открыло бы
# сайты всем, чей адрес подменён.
proxy_sites:
  - host: air-gis.home.arpa
    upstream: air-gis:8080
  - host: prometheus.home.arpa
    upstream: prometheus:9090
    allowed_sources: "{{ proxy_vpn_sources }}"
  - host: alertmanager.home.arpa
    upstream: alertmanager:9093
    allowed_sources: "{{ proxy_vpn_sources }}"
  - host: grafana.home.arpa
    upstream: grafana:3000
    allowed_sources: "{{ proxy_vpn_sources }}"

# Метрики Caddy для Prometheus (число и длительность запросов по сайтам, состояние upstream).
# Отдаются по HTTP на отдельном порту, который на хосте не публикуется: он виден только из сетей
# Docker, а отвечает только адресам из proxy_metrics_sources — сети мониторинга (group_vars/all.yml).
proxy_metrics_port: 9180
proxy_metrics_sources:
  - "{{ monitoring_subnet }}"

proxy_memory_limit: 128m
proxy_cpus: "0.50"
proxy_pids_limit: 128
proxy_wait_timeout: 60
