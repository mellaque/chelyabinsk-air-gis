---
# Обратный прокси Caddy: HTTPS с сертификатами собственного центра сертификации, единственная
# точка входа веб-трафика. Сайты находит по именам контейнеров в общих сетях Docker.

# Значения не выводятся: при ошибке видно только, какое из условий не выполнено.
# Что ключ подходит к сертификату, проверяет сам Caddy при загрузке конфигурации.
- name: Корень центра сертификации задан
  ansible.builtin.assert:
    that:
      - vault_caddy_root_cert is defined
      - vault_caddy_root_key is defined
      - proxy_ca_root_cert is search('-----BEGIN CERTIFICATE-----')
      - proxy_ca_root_key is search('-----BEGIN (EC |RSA )?PRIVATE KEY-----')
      - "'заменить' not in proxy_ca_root_cert"
      - "'заменить' not in proxy_ca_root_key"
    fail_msg: >-
      В файле с секретами нужны vault_caddy_root_cert и vault_caddy_root_key в PEM
      (образец и как их получить — vault.example.yml):
      ansible-playbook playbook.yml -K -e @$HOME/.config/air-gis/vault.yml --ask-vault-pass
    quiet: true

- name: Каталог конфигурации
  ansible.builtin.file:
    path: "{{ proxy_dir }}/conf"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Каталог монтируется в контейнер целиком (не отдельные файлы): Caddy читает корень при каждой
# загрузке конфигурации, а заменённый Ansible файл в примонтированном файле был бы не виден.
# Caddy в контейнере работает от root — ему и только ему доступны файлы.
- name: Каталог корня центра сертификации
  ansible.builtin.file:
    path: "{{ proxy_dir }}/ca"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Корневой сертификат центра сертификации
  ansible.builtin.copy:
    content: "{{ proxy_ca_root_cert | trim }}\n"
    dest: "{{ proxy_dir }}/ca/root.crt"
    owner: root
    group: root
    mode: "0444"
  notify: Перечитать конфигурацию Caddy

- name: Ключ корня центра сертификации
  ansible.builtin.copy:
    content: "{{ proxy_ca_root_key | trim }}\n"
    dest: "{{ proxy_dir }}/ca/root.key"
    owner: root
    group: root
    mode: "0400"
  no_log: true   # иначе ключ попал бы в вывод и в diff
  notify: Перечитать конфигурацию Caddy

# Перед заменой синтаксис проверяет сам Caddy из того же образа
- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ proxy_dir }}/conf/Caddyfile"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm --network none --volume %s:/tmp/Caddyfile:ro {{ proxy_image }}
      caddy adapt --config /tmp/Caddyfile --adapter caddyfile
  notify: Перечитать конфигурацию Caddy

- name: Описание сервиса — compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ proxy_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
    validate: docker compose -f %s config --quiet
  register: proxy_compose

- name: Работает ли контейнер
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ proxy_dir }}/compose.yaml", ps, --status, running, --quiet]
  register: proxy_running
  changed_when: false
  failed_when: false
  check_mode: false

- name: Caddy запущен и отвечает на healthcheck
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ proxy_dir }}/compose.yaml"
      - up
      - --detach
      - --wait
      - --wait-timeout
      - "{{ proxy_wait_timeout }}"
  changed_when: true
  when: proxy_compose is changed or (proxy_running.stdout | default('') | trim) == ''
