---
# Базовая настройка хоста. Каждая настройка лежит в отдельном файле каталога *.d — стандартные
# конфиги пакетов не трогаем, поэтому обновления пакетов не спрашивают, чью версию оставить.

- name: Установлены базовые пакеты
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600   # список пакетов обновляется не чаще раза в час — повторные прогоны быстрые

- name: Часовой пояс
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ base_timezone }}"
    dest: /etc/localtime
    state: link

# Вход только по ключу и не под root. Перед заменой файл проверяет сам sshd: с ошибкой в конфиге
# он не запустится, а это единственный удалённый вход на сервер.
- name: SSH — вход только по ключу, без root
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Перечитать настройки sshd

- name: Обновления безопасности ставятся автоматически
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Закрытая крышка ноутбука не усыпляет сервер
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/lid.conf
    content: |
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
    owner: root
    group: root
    mode: "0644"
  notify: Перезапустить systemd-logind

- name: Режимы сна отключены
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: "{{ base_sleep_targets }}"

- name: Firewall хоста
  ansible.builtin.import_tasks: firewall.yml
