---
app_image: ghcr.io/mellaque/chelyabinsk-air-gis
# app_image_digest задаётся в group_vars/all.yml — значения по умолчанию нет намеренно:
# без явно указанной версии роль не запустится.

# Каталог с compose.yaml на сервере
app_dir: /opt/air-gis

# Ограничения контейнера: nginx со статикой занимает около 10–20 МБ
app_memory_limit: 64m
app_cpus: "0.50"
app_pids_limit: 64

# Сколько секунд ждать, пока контейнер станет healthy
app_wait_timeout: 60

# cosign — проверка подписи образа. Бинарник скачивается с GitHub, контрольная сумма зафиксирована.
app_cosign_version: v3.1.4
app_cosign_checksum: sha256:424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa

# Кем должен быть подписан образ: подпись выпущена для workflow этого репозитория на GitHub Actions
# (keyless: ключа нет, сертификат выдаётся под OIDC-токен запуска). Те же значения — в SECURITY.md.
app_cosign_identity_regexp: ^https://github.com/mellaque/chelyabinsk-air-gis/
app_cosign_oidc_issuer: https://token.actions.githubusercontent.com
