# Конфигурация сайта для образа nginxinc/nginx-unprivileged (nginx работает не от root, порт 8080).
# Кладётся в /etc/nginx/conf.d/default.conf.

server {
    # Только IPv4: если добавить `listen [::]:8080`, а в Docker IPv6 выключен, nginx не запустится.
    # Для локального запуска и для работы за обратным прокси этого достаточно.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json application/geo+json;

    server_tokens off;   # не показывать версию nginx в ответах

    # Сжатие: hno3_data.json 142 КБ → 44 КБ, region.geojson 832 КБ → 246 КБ
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    # Файлы данных обновляются без смены имени, поэтому браузер должен каждый раз сверяться
    # с сервером (быстрый ответ 304 по ETag, если файл не менялся). Именно отсутствие такой
    # проверки привело к ошибке «устаревший формат» после обновления данных.
    add_header Cache-Control "no-cache" always;

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Проверка живости для Docker HEALTHCHECK и мониторинга
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # GeoJSON нет в стандартном mime.types
    location ~* \.geojson$ {
        default_type application/geo+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Скрытые файлы (.git, .env и т. п.) не отдаём, даже если они случайно попадут в образ
    location ~ /\. {
        return 404;
    }
}
