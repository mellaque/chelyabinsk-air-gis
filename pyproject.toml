# Настройки инструментов разработки (сам проект не устанавливается как пакет)

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["scripts/legacy/extract_hno3_cities.py"]  # исходный скрипт ВКР храним как есть

[tool.ruff.lint]
# E/W — стиль, F — ошибки (неиспользуемые импорты, неопределённые имена),
# I — порядок импортов, B — типичные баги, UP — устаревший синтаксис
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Предупреждение изнутри netCDF4 при работе с NumPy ≥ 2.5, к нашему коду не относится
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
