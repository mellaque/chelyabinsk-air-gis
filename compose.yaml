# Запуск сайта:                    docker compose up -d --build   → http://localhost:8080
# Остановка:                       docker compose down
# Скачать данные NASA и обновить   docker compose run --rm update        (нужен EARTHDATA_TOKEN,
#   все data/*.json:                                                       см. README)
# Только пересобрать HNO₃ из .nc:  docker compose run --rm pipeline

name: chelyabinsk-air-gis

services:
  web:
    build: .
    image: chelyabinsk-air-gis-web:local
    pull_policy: build            # образ собирается локально, не искать его в Docker Hub
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Минимум прав: файловая система только для чтения, без capabilities
    read_only: true
    tmpfs:
      - /tmp                      # сюда nginx пишет pid и временные файлы
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pipeline: &pipeline
    profiles: ["pipeline"]        # не запускается при обычном `docker compose up`
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: chelyabinsk-air-gis-pipeline:local
    pull_policy: build
    volumes:
      - ./data:/app/data          # сюда читаются .nc и пишется результат
      - ./config:/app/config:ro
    command:
      - --input
      - data/raw/hno3
      - --substance
      - hno3
      - --units
      - ppb
      - --output
      - data/hno3_data.json

  update:
    <<: *pipeline                 # тот же образ, тома и профиль, что у pipeline
    entrypoint: ["bash", "scripts/update_data.sh"]
    command: []                   # можно перечислить вещества: docker compose run --rm update co o3
    environment:
      # Токен берётся из окружения или файла .env (он в .gitignore) и в образ не попадает
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
