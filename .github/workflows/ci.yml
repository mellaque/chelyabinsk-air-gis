# Проверки при каждом push в main и в каждом pull request.
# Если какая-то проверка падает, PR помечается красным и его не стоит мержить.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # ручной запуск со вкладки Actions

permissions:
  contents: read            # workflow только читает код

concurrency:                # новый push в ту же ветку отменяет устаревший запуск
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} — ruff и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Ruff — стиль и типичные ошибки
        run: ruff check --output-format=github .

      - name: Тесты
        run: pytest

  data:
    name: Проверка файлов данных
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Скрипт использует только стандартную библиотеку — зависимости не нужны
      - name: Формат data/*.json и region.geojson
        run: python scripts/validate_data.py

  frontend:
    name: Проверка фронтенда
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Синтаксис JavaScript
        run: node --check js/app.js

      - name: Локальные файлы, подключённые в index.html, существуют
        run: |
          missing=0
          while read -r f; do
            if [ -f "$f" ]; then echo "ok  $f"; else echo "::error file=index.html::нет файла $f"; missing=1; fi
          done < <(grep -oE '(src|href)="(css|js)/[^"]+"' index.html | cut -d'"' -f2)
          exit $missing

  docker:
    name: Docker — сборка и smoke-тест
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hadolint — проверка Dockerfile
        run: |
          pip install hadolint-bin==2.15.1
          hadolint Dockerfile Dockerfile.pipeline

      - name: Проверка compose.yaml
        run: docker compose --profile pipeline config --quiet

      - name: Сборка образа сайта
        run: docker build -t air-gis-web:ci .

      - name: Сборка образа пайплайна
        run: docker build -f Dockerfile.pipeline -t air-gis-pipeline:ci .

      - name: Запуск контейнера с теми же ограничениями, что в compose.yaml
        run: |
          docker run -d --name web -p 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            air-gis-web:ci

      - name: Ожидание healthcheck
        run: |
          for _ in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' web)
            echo "health: $state"
            [ "$state" = "healthy" ] && exit 0
            sleep 2
          done
          echo "::error::контейнер не стал healthy за 60 секунд"
          exit 1

      - name: Smoke-тест сайта
        run: bash scripts/smoke_test.sh http://localhost:8080

      - name: Образ пайплайна запускается
        run: docker run --rm air-gis-pipeline:ci --help

      - name: Логи контейнера (при ошибке)
        if: failure()
        run: docker logs web || true

      - name: Размер образов
        if: always()
        run: docker image ls --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E 'REPOSITORY|air-gis'
