# CI/CD проекта.
#   Pull request      → проверки (lint, python, data, frontend, docker). Красный PR не мержим.
#   Push в main       → те же проверки, затем публикация образов в GHCR и сайта на GitHub Pages.
#   Тег vX.Y.Z        → проверки и образы с номером версии (например, :2.0.0 и :2.0).
name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:        # ручной запуск со вкладки Actions

permissions:
  contents: read            # по умолчанию только чтение; права на публикацию выдаются отдельным jobs

concurrency:
  group: ci-${{ github.ref }}
  # В PR новый push отменяет устаревший запуск. В main и тегах — нет: прерванный деплой хуже лишнего
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Линтеры — workflow и shell-скрипты
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # git-токен после checkout не нужен — не оставляем его на диске

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Установка линтеров (версии — в requirements-lint.txt)
        run: pip install -r requirements-lint.txt

      - name: actionlint — синтаксис и выражения workflow, shellcheck для шагов run
        run: actionlint

      - name: zizmor — безопасность workflow и настроек Dependabot
        env:
          # токен только на чтение: онлайн-проверки (уязвимые версии actions, подменённые коммиты)
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .

      - name: shellcheck — скрипты
        run: shellcheck scripts/*.sh

  python:
    name: Python ${{ matrix.python-version }} — ruff и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 — как в Docker-образе (минимальная поддерживаемая), 3.14 — самая свежая
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # git-токен после checkout не нужен — не оставляем его на диске

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # без cache: pip — кэш в workflow, который публикует образы, можно отравить (zizmor: cache-poisoning)

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Ruff — стиль и типичные ошибки
        run: ruff check --output-format=github .

      - name: Тесты
        run: pytest

  data:
    name: Проверка файлов данных
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # git-токен после checkout не нужен — не оставляем его на диске

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Скрипт использует только стандартную библиотеку — зависимости не нужны
      - name: Формат data/*.json и region.geojson
        run: python scripts/validate_data.py

  frontend:
    name: Проверка фронтенда
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # git-токен после checkout не нужен — не оставляем его на диске

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Библиотеки из npm — точно по package-lock.json, без install-скриптов
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: vendor/ побайтно совпадает с пакетами npm
        run: python3 scripts/vendor_frontend.py --check

      - name: Синтаксис JavaScript
        run: for f in js/*.js; do node --check "$f"; done

      - name: Локальные файлы, подключённые в index.html, существуют
        run: |
          missing=0
          while read -r f; do
            if [ -f "$f" ]; then echo "ok  $f"; else echo "::error file=index.html::нет файла $f"; missing=1; fi
          done < <(grep -oE '(src|href)="(css|js|vendor)/[^"]+"' index.html | cut -d'"' -f2)
          exit $missing

  docker:
    name: Docker — сборка и smoke-тест
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # git-токен после checkout не нужен — не оставляем его на диске

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Hadolint — проверка Dockerfile
        run: |
          pip install "$(grep '^hadolint-bin==' requirements-lint.txt)"   # версия — из requirements-lint.txt
          hadolint Dockerfile Dockerfile.pipeline

      - name: Проверка compose.yaml
        run: docker compose --profile pipeline config --quiet

      - name: Сборка образа сайта
        run: docker build -t air-gis-web:ci .

      - name: Сборка образа пайплайна
        run: docker build -f Dockerfile.pipeline -t air-gis-pipeline:ci .

      - name: Запуск контейнера с теми же ограничениями, что в compose.yaml
        run: |
          docker run -d --name web -p 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            air-gis-web:ci

      - name: Ожидание healthcheck
        run: |
          for _ in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' web)
            echo "health: $state"
            [ "$state" = "healthy" ] && exit 0
            sleep 2
          done
          echo "::error::контейнер не стал healthy за 60 секунд"
          exit 1

      - name: Smoke-тест сайта
        run: bash scripts/smoke_test.sh http://localhost:8080

      - name: Образ пайплайна запускается
        run: docker run --rm air-gis-pipeline:ci --help

      # Обязательная проверка: критическая уязвимость, для которой уже вышло исправление, — образ не проходит.
      # Подробные отчёты по всем уровням — в workflow Security (вкладка Security на GitHub).
      - name: Trivy — критические уязвимости в образе сайта
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.75.0
          image-ref: air-gis-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy — критические уязвимости в образе пайплайна
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.75.0
          image-ref: air-gis-pipeline:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true        # Trivy уже установлен предыдущим шагом

      - name: Логи контейнера (при ошибке)
        if: failure()
        run: docker logs web || true

      - name: Размер образов
        if: always()
        run: docker image ls --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E 'REPOSITORY|air-gis'

  # ---------------- Публикация (только после успешных проверок, только main и теги) ----------------
  # Линтеры публикацию не задерживают: zizmor обращается к API GitHub, и сбой API или новое
  # предупреждение о уязвимости в action не должны останавливать деплой. В main линтеры
  # попадают как проверка pull request.

  # Публикуется ровно тот образ, который проверен: образ уходит в реестр без тегов, по digest;
  # этот digest запускается и проверяется (smoke-тест, Trivy), подписывается — и только потом
  # получает теги latest, sha-… и версии. Если проверка не прошла, теги остаются на прежнем образе.
  publish-images:
    name: Публикация образа ${{ matrix.image }} в GHCR
    needs: [python, data, frontend, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Публикации одного образа — по очереди: если тег vX.Y.Z поставлен сразу после мержа,
    # запуски из main и из тега иначе перевешивали бы latest и sha-… наперегонки
    concurrency:
      group: publish-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write           # право публиковать образы в GitHub Container Registry
      id-token: write           # для подписи образа cosign без ключей (OIDC-токен GitHub → Sigstore)
    strategy:
      matrix:
        include:
          - image: chelyabinsk-air-gis
            dockerfile: Dockerfile
          - image: chelyabinsk-air-gis-pipeline
            dockerfile: Dockerfile.pipeline
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # git-токен после checkout не нужен — не оставляем его на диске

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Вход в ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # отдельный токен не нужен

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Сборка и отправка в реестр без тегов — только по digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          sbom: true                    # список всех пакетов в образе (SBOM) — прикладывается к образу
          provenance: mode=max          # откуда и как собран образ (коммит, workflow, параметры)

      - name: Проверка опубликованного образа сайта — запуск и smoke-тест
        if: matrix.image == 'chelyabinsk-air-gis'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name web -p 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            "${IMAGE}@${DIGEST}"
          state=starting
          for _ in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' web)
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          if [ "$state" != "healthy" ]; then
            docker logs web
            echo "::error::опубликованный образ не стал healthy за 60 секунд"
            exit 1
          fi
          bash scripts/smoke_test.sh http://localhost:8080

      - name: Проверка опубликованного образа пайплайна — запуск
        if: matrix.image == 'chelyabinsk-air-gis-pipeline'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker run --rm "${IMAGE}@${DIGEST}" --help

      - name: Trivy — критические уязвимости в опубликованном образе
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Подпись образа (cosign, без ключей)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        # Подписывается конкретный digest, а не тег: тег можно перевесить, digest — нет
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Теги — на проверенный и подписанный digest, без пересборки
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        # --prefer-index=false — точная копия: тег указывает ровно на подписанный digest,
        # и cosign verify по тегу находит подпись. Ниже это проверяется для каждого тега.
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create --prefer-index=false "${args[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::тег $tag указывает на $got, а не на проверенный $DIGEST"
              exit 1
            fi
            echo "ok  $tag → $DIGEST"
          done <<< "$TAGS"

  pages:
    name: Публикация сайта на GitHub Pages
    needs: [python, data, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write              # публикация на Pages
      id-token: write           # подтверждение, что деплой идёт из этого репозитория
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # git-токен после checkout не нужен — не оставляем его на диске

      - name: Сборка сайта — только файлы, нужные в браузере
        run: |
          mkdir -p _site/data
          cp -r index.html css js vendor _site/
          cp data/*.json data/region.geojson _site/data/
          find _site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - name: Деплой
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      - name: Проверка опубликованного сайта
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          URL="${URL%/}/"
          for path in "" js/app.js vendor/leaflet/leaflet.js data/hno3_data.json data/region.geojson; do
            ok=0
            for _ in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${URL}${path}")
              if [ "$code" = 200 ]; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" = 1 ]; then echo "ok   ${URL}${path}"; else echo "::error::${URL}${path} → $code"; exit 1; fi
          done
