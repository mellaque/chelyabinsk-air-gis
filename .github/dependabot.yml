# Dependabot раз в месяц проверяет обновления и сам открывает pull request.
# CI прогонит на нём тесты — останется только посмотреть и смержить.
#
# cooldown — новая версия предлагается не раньше чем через 7 дней после выхода: если релиз
# окажется вредоносным или сломанным, его обычно успевают отозвать.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip       # requirements.txt, requirements-dev.txt, requirements-lint.txt
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:                       # все обновления Python-пакетов — одним PR
      python:
        patterns: ["*"]

  - package-ecosystem: docker    # базовые образы в Dockerfile и Dockerfile.pipeline
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker"
    ignore:
      # Образы остаются на Python 3.12 — минимальной поддерживаемой версии (CI проверяет 3.12 и 3.14).
      # Когда базовые образы закреплены по digest (FROM …@sha256:…), Dependabot обновляет и digest.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
