# Dependabot проверяет обновления (базовые образы — раз в неделю, остальное — раз в месяц)
# и сам открывает pull request. CI прогонит на нём тесты — останется только посмотреть и смержить.
#
# cooldown — новая версия предлагается не раньше чем через 7 дней после выхода: если релиз
# окажется вредоносным или сломанным, его обычно успевают отозвать.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip       # requirements.txt, requirements-dev.txt, requirements-lint.txt
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:                       # все обновления Python-пакетов — одним PR
      python:
        patterns: ["*"]

  # Базовые образы в Dockerfile и Dockerfile.pipeline закреплены по digest (FROM образ:тег@sha256:…):
  # сборка не меняется сама по себе, новый digest приходит только этим PR. Поэтому раз в неделю —
  # чтобы исправления уязвимостей в пакетах Debian и Alpine не ждали месяц.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker"
    ignore:
      # Образы остаются на Python 3.12 — минимальной поддерживаемой версии (CI проверяет 3.12 и 3.14).
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
