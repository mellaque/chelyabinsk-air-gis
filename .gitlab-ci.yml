# CI для зеркала на GitLab. Основной репозиторий и CI/CD — на GitHub (.github/workflows/),
# здесь те же проверки, но средствами GitLab: стадии, parallel:matrix, docker-in-docker,
# артефакты между job и встроенные шаблоны SAST и поиска секретов.
#
# Запускается только для main, тегов, merge request и вручную (Build → Pipelines → Run pipeline):
# зеркало получает все ветки разом, и запуск на каждой тратил бы бесплатные минуты CI.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test
  - build
  - security

default:
  interruptible: true             # новый пайплайн отменяет устаревший

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_IMAGE: python:3.12-slim
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  DOCKER_VERSION: "29"

include:
  # Встроенные шаблоны GitLab: статический анализ (Semgrep) и поиск секретов.
  # В бесплатном тарифе результаты доступны как артефакты job.
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Задания из шаблонов — в стадию test (иначе шаблон может сослаться на стадию, которой нет в списке)
semgrep-sast:
  stage: test

secret_detection:
  stage: test

# ---------------------------------------------------------------- lint

ruff:
  stage: lint
  image: $PYTHON_IMAGE
  script:
    - pip install ruff==0.16.10
    - ruff check --exit-zero --output-format=gitlab --output-file=gl-code-quality-report.json .   # отчёт для MR
    - ruff check .                                                                                  # проверка
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json   # замечания видны прямо в merge request

hadolint:
  stage: lint
  image: $PYTHON_IMAGE
  script:
    - pip install hadolint-bin==2.15.1
    - hadolint Dockerfile Dockerfile.pipeline

frontend:
  stage: lint
  image: node:22-alpine
  script:
    - node --check js/app.js
    # Локальные файлы, подключённые в index.html, существуют
    - |
      missing=0
      for f in $(grep -oE '(src|href)="(css|js)/[^"]+"' index.html | cut -d'"' -f2); do
        if [ -f "$f" ]; then echo "ok  $f"; else echo "нет файла $f"; missing=1; fi
      done
      exit $missing

# ---------------------------------------------------------------- test

pytest:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.14"]
  cache:
    key: pip-$PYTHON_VERSION
    paths: [.cache/pip]
  script:
    - pip install -r requirements-dev.txt
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml           # результаты тестов во вкладке Tests пайплайна и в MR

validate-data:
  stage: test
  image: $PYTHON_IMAGE
  script:
    - python scripts/validate_data.py   # только стандартная библиотека — без установки зависимостей

# ---------------------------------------------------------------- build

docker:
  stage: build
  image: docker:${DOCKER_VERSION}-cli
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add --no-cache bash curl
    - until docker info >/dev/null 2>&1; do sleep 1; done
  script:
    - docker compose --profile pipeline config --quiet
    - docker build -t air-gis-web:ci .
    - docker build -f Dockerfile.pipeline -t air-gis-pipeline:ci .
    # Контейнер с теми же ограничениями, что в compose.yaml.
    # В docker-in-docker порт открывается на хосте службы dind — он доступен по имени docker.
    - >
      docker run -d --name web -p 8080:8080
      --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true
      air-gis-web:ci
    - |
      for _ in $(seq 1 30); do
        state=$(docker inspect --format '{{.State.Health.Status}}' web)
        echo "health: $state"
        [ "$state" = "healthy" ] && break
        sleep 2
      done
      [ "$state" = "healthy" ] || { docker logs web; exit 1; }
    - bash scripts/smoke_test.sh http://docker:8080
    - docker run --rm air-gis-pipeline:ci --help
    # Образы — следующему job для сканирования Trivy
    - docker save air-gis-web:ci -o web.tar
    - docker save air-gis-pipeline:ci -o pipeline.tar
  artifacts:
    paths: [web.tar, pipeline.tar]
    expire_in: 1 day

# ---------------------------------------------------------------- security

trivy-images:
  stage: security
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  needs: [docker]
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths: [.cache/trivy]
  script:
    # Та же политика, что на GitHub (SECURITY.md): отчёт — High/Critical с исправлением,
    # блокирует — Critical с исправлением
    - trivy image --input web.tar --severity HIGH,CRITICAL --ignore-unfixed
    - trivy image --input pipeline.tar --severity HIGH,CRITICAL --ignore-unfixed
    - trivy image --input web.tar --severity CRITICAL --ignore-unfixed --exit-code 1
    - trivy image --input pipeline.tar --severity CRITICAL --ignore-unfixed --exit-code 1

trivy-repo:
  stage: security
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  needs: []
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths: [.cache/trivy]
  script:
    # Зависимости, секреты, конфигурация; отчёт для виджета Code Quality в merge request
    - >
      trivy fs --scanners vuln,secret,misconfig --skip-dirs data/raw
      --format template --template "@/contrib/gitlab-codequality.tpl"
      --output gl-codequality-trivy.json .
    - trivy fs --scanners vuln,secret,misconfig --skip-dirs data/raw --exit-code 1 --severity HIGH,CRITICAL .
  artifacts:
    when: always
    reports:
      codequality: gl-codequality-trivy.json
