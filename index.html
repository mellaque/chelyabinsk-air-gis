<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Концентрация веществ в Челябинской области</title>
    
    <!-- Политика безопасности (CSP): скрипты, стили и шрифты — только с этого сайта (библиотеки лежат
         в vendor/, см. scripts/vendor_frontend.py), картинки — ещё и тайлы OpenStreetMap, данные — только
         свои. Встроенных скриптов и стилей на странице нет. Задана здесь, а не заголовком nginx, чтобы
         действовать и на GitHub Pages. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org https://*.tile.openstreetmap.fr; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'">

    <!-- Стили — в прежнем порядке: карта, элементы управления, иконки, шрифт, страница -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/map-controls.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="vendor/open-sans/open-sans.css">
    <link rel="stylesheet" href="css/page.css">
</head>
<body>
    <div id="container">
        <!-- Кнопка переключения темы -->
        <button id="theme-toggle" title="Переключить тему">
            <i class="fas fa-moon"></i>
        </button>
        
        <!-- Основная карта -->
        <div id="map"></div>
        
        <!-- Панель управления -->
        <div id="controls">
            <h2><i class="fas fa-sliders-h"></i> Параметры отображения</h2>

            <div class="control-group">
            <label for="substance"><i class="fas fa-flask"></i> Вещество:</label>
            <select id="substance"><!-- заполняется из js/app.js --></select>
            </div>
            
            <div class="control-group">
                <label for="year"><i class="fas fa-calendar-alt"></i> Год:</label>
                <select id="year"></select>
            </div>
            
            <div class="control-group">
                <label for="month"><i class="fas fa-calendar-week"></i> Месяц:</label>
                <select id="month"></select>
            </div>
            
            <div class="control-group">
                <label for="level"><i class="fas fa-layer-group"></i> Уровень высоты:</label>
                <select id="level"></select>
            </div>
            
            <div class="control-group">
                <button id="animate-years-btn">
                    <i class="fas fa-calendar-alt"></i> Анимировать по годам
                </button>
            </div>

            <div class="control-group">
                <button id="animate-btn">
                    <i class="fas fa-play"></i> Анимировать по месяцам
                </button>
            </div>

            <div class="control-group">
                <button id="animate-levels-btn">
                    <i class="fas fa-layer-group"></i> Анимировать по уровням
                </button>
            </div>
            
            <div id="chart-container">
                <canvas id="chart" width="280" height="250"></canvas>
            </div>
            
            <div class="info-panel">
                <h3><i class="fas fa-info-circle"></i> Информация</h3>
                <div id="data-info"></div>
            </div>
        </div>
    </div>

    <div id="concentration-legend"></div>

    <!-- Библиотеки -->
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/chart.js/chart.umd.js"></script>

    <!-- Карта, график, анимации; переключение темы -->
    <script src="js/app.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
